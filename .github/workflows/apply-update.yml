name: apply-update
on:
  push:
    paths: ['*.zip']
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          shopt -s nullglob
          for f in *-update.zip; do unzip -o "$f" && git rm -f "$f"; done
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m "apply update" || true
          git push
